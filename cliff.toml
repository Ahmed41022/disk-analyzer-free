# git-cliff configuration for Conventional Commit history.

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci|^build|^chore", group = "Maintenance" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"

[changelog]
header = "# Changelog\n\nAll notable changes to Disk Analyzer Free are documented here.\n"
body = "{% if version %}## [{{ version }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}{% else %}## [Unreleased]{% endif %}\n{% for group, commits in commits | group_by(attribute=\"group\") %}\n### {{ group }}\n\n{% for commit in commits %}- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end=\"\") }})\n{% endfor %}{% endfor %}"
trim = true

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
