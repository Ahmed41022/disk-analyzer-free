[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "disk-analyzer-free"
version = "0.1.0"
description = "Cross-platform disk space analyzer"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Disk Analyzer Free contributors" }]
dependencies = [
  "numpy>=2.0",
  "click>=8.1",
  "rich>=13",
  "platformdirs>=4",
  "Send2Trash>=1.8",
  "tomli-w>=1",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
dev = [
  "pytest",
  "pytest-qt",
  "pytest-timeout",
  "hypothesis",
  "syrupy",
  "jsonschema",
  "pypdf",
  "ruff",
  "mypy",
  "coverage[toml]",
  "gcovr",
  "babel",
  "pip-licenses",
  "pip-audit",
  "nanobind>=3.1",
]

[project.scripts]
dafree = "dafree.cli.main:cli"

[project.gui-scripts]
"disk-analyzer-free" = "dafree.gui.app:main"

[tool.scikit-build]
wheel.packages = ["src/dafree"]
wheel.py-api = "cp312"
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.26"
cmake.build-type = "Debug"
sdist.include = ["core/**", "bindings/**", "cmake/**", "CMakeLists.txt", "CMakePresets.json"]

[tool.ruff]
extend-exclude = ["PLAN.md", "docs/PLAN.md"]
