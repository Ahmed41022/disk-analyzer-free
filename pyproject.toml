[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "disk-analyzer-free"
version = "0.1.0"
description = "Cross-platform disk space analyzer"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Disk Analyzer Free contributors" }]
dependencies = [
  "numpy>=2.0",
  "click>=8.1",
  "rich>=13",
  "platformdirs>=4",
  "Send2Trash>=1.8",
  "tomli-w>=1",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
dev = [
  "pytest",
  "pytest-qt",
  "pytest-timeout",
  "hypothesis",
  "syrupy",
  "jsonschema",
  "pypdf",
  "ruff",
  "mypy",
  "coverage[toml]",
  "gcovr",
  "babel",
  "pip-licenses",
  "pip-audit",
  "nanobind>=3.1",
]
docs = ["mkdocs-material>=9.8,<10", "mkdocs-click>=0.9,<1"]
freeze = ["PyInstaller>=6.22,<7"]

[project.scripts]
dafree = "dafree.cli.main:cli"

[project.gui-scripts]
"disk-analyzer-free" = "dafree.gui.app:main"

[tool.scikit-build]
wheel.packages = ["src/dafree"]
wheel.py-api = "cp312"
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.26"
cmake.build-type = "Debug"
sdist.include = ["core/**", "bindings/**", "cmake/**", "CMakeLists.txt", "CMakePresets.json"]

[tool.ruff]
extend-exclude = ["PLAN.md", "docs/PLAN.md"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "PL", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"shutil.rmtree" = { msg = "Use dafree.actions for safe filesystem removal." }
"os.system" = { msg = "Use subprocess with an argument list." }

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
plugins = []
files = ["src/dafree"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
timeout = 120
testpaths = ["tests"]
markers = [
  "gui: requires the Qt GUI dependencies",
  "slow: long-running tests",
  "windows_only: Windows-specific behavior",
  "needs_mounts: requires mount privileges",
  "needs_scheduler: requires OS scheduler integration",
  "needs_smb: requires an SMB share",
]

[tool.coverage.run]
branch = true
source = ["dafree"]

[tool.coverage.paths]
source = ["src/dafree", "*/site-packages/dafree"]
