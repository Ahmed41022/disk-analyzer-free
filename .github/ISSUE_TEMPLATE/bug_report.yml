name: Bug report
description: Report a reproducible problem.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 14, or Linux distribution
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options: [Installer, Portable, pip, Source checkout]
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [GUI, CLI, Both]
    validations:
      required: true
  - type: input
    id: scan_mode
    attributes:
      label: Scan mode
      description: Walk, Windows fast mode, or not applicable.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log details
      description: Logs are stored under the application's logs directory. Remove personal paths or data before sharing.
