name: Release bundle verification

# T4.14 verifies actual frozen GUIs. T10.1 adds installers, size budgets, tags,
# signing, and publication; this workflow cannot publish a release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/dist/**
      - packaging/licenses/**
      - src/dafree/gui/**
      - tests/e2e/**
      - requirements/freeze.txt

permissions:
  contents: read

concurrency:
  group: frozen-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  DAFREE_REQUIRE_GUI: "1"
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  CMAKE_BUILD_PARALLEL_LEVEL: "3"
  SKBUILD_CMAKE_BUILD_TYPE: Release

defaults:
  run:
    shell: bash

jobs:
  frozen:
    name: Frozen GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/freeze.txt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 fonts-dejavu-core
      - name: Install locked freezing tools
        run: python -m pip install --require-hashes -r requirements/freeze.txt
      - name: Install package (MSVC)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Ninja
          CC: cl
          CXX: cl
          SKBUILD_CMAKE_ARGS: -DDAFREE_REQUIRE_MSVC=ON
        run: python -m pip install ".[gui]" pytest pytest-timeout
      - name: Install package
        if: runner.os != 'Windows'
        run: python -m pip install ".[gui]" pytest pytest-timeout
      - name: Freeze actual GUI
        run: python tools/dist/build_frozen.py --out dist/frozen-smoke
      - name: Frozen end-to-end checks
        env:
          DAFREE_FROZEN_EXECUTABLE: ${{ github.workspace }}/dist/frozen-smoke/DiskAnalyzerFree/DiskAnalyzerFree${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m pytest tests/e2e/test_frozen_selftest.py --junitxml=frozen-junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frozen-smoke-${{ matrix.os }}-results
          path: frozen-junit.xml
          if-no-files-found: error
          retention-days: 14
