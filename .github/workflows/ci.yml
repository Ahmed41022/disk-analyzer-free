name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  DAFREE_REQUIRE_GUI: 1
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint, types, stubs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Install dev tools and package
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install ".[gui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Native stubs are current
        run: |
          python tools/gen_stubs.py
          git diff --exit-code src/dafree/_core.pyi

  cpp:
    name: C++ build and unit tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install CMake and Ninja
        run: python -m pip install cmake ninja
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Unit tests
        run: ctest --preset dev --output-junit cpp-junit.xml
      - name: Summary
        if: always()
        run: python tools/junit_summary.py cpp-junit.xml >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.15" }
          - { os: windows-2025, python: "3.14" }
          - { os: macos-15, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
      - name: Install dev and GUI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install ".[gui]"
      - name: Python tests
        run: python -m pytest -m "not slow" --junitxml=py-junit.xml
      - name: Summary
        if: always()
        run: python tools/junit_summary.py py-junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-reports-${{ matrix.os }}-${{ matrix.python }}
          path: py-junit.xml
          retention-days: 14

  audit:
    name: Security and dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict -r requirements/dev.txt -r requirements/freeze.txt
      - name: Runtime license allowlist
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install ".[gui]" pip-licenses
          "$RUNNER_TEMP/runtime/bin/pip-licenses" \
            --allow-only="MIT;MIT License;BSD License;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache Software License;ISC;Python Software Foundation License;PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);MPL-2.0;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0" \
            --ignore-packages PySide6-Essentials shiboken6
      - name: C++ dependency licenses
        run: python tools/cpp_licenses.py cmake/Dependencies.cmake

  ci-success:
    name: ci-success
    if: always()
    needs: [lint, cpp, python, audit]
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$bad" ]; then
            echo "::error::Failed jobs: $bad"
            exit 1
          fi
