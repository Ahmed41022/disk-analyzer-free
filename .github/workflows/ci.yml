name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  DAFREE_REQUIRE_GUI: 1
  DAFREE_REQUIRE_ALL_CAPS: 1
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint, types, stubs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Install dev tools and package
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install ".[gui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Native stubs are current
        run: |
          python tools/gen_stubs.py
          git diff --exit-code src/dafree/_core.pyi
      - name: Translation catalogues are current
        run: python tools/i18n_check.py
      - name: Unicode fold table is current
        run: |
          python tools/gen_unicode_fold.py
          git diff --exit-code -- core/src/model/unicode_fold_table.hpp

  cpp:
    name: C++ build and unit tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install CMake and Ninja
        run: python -m pip install cmake ninja Babel
      - name: Configure
        run: cmake --preset dev -DDAFREE_BUILD_BENCH=ON
      - name: Build
        run: cmake --build --preset dev
      - name: Unit tests
        run: ctest --preset dev --output-junit cpp-junit.xml
      - name: Mock scan benchmark smoke
        run: |
          ./build/dev/core/bench/dafree_bench${{ runner.os == 'Windows' && '.exe' || '' }} \
            --benchmark_filter=BM_ScanMock/10000/ --benchmark_min_time=0.01s
      - name: Summary
        if: always()
        run: python tools/junit_summary.py cpp-junit.xml >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.15" }
          - { os: windows-2025, python: "3.14" }
          - { os: macos-15, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Install dev and GUI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install ".[gui]"
      - name: Python tests
        run: python -m pytest -m "not slow" --hypothesis-show-statistics --junitxml=py-junit.xml
      - name: Summary
        if: always()
        run: python tools/junit_summary.py py-junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-reports-${{ matrix.os }}-${{ matrix.python }}
          path: py-junit.xml
          retention-days: 14

  asan:
    name: Native AddressSanitizer and UndefinedBehaviorSanitizer
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install cmake ninja Babel
      - name: Configure and build native sanitizer tests
        run: |
          cmake --preset dev-asan -DCMAKE_CXX_COMPILER=g++
          cmake --build build/dev-asan --target dafree_core_tests
      - name: Full native suite under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/dev-asan --output-on-failure

  coverage:
    name: Model and scanner coverage (85% lines)
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install coverage tools
        run: python -m pip install cmake ninja Babel gcovr==8.8
      - name: Configure and run instrumented native tests
        run: |
          cmake --preset coverage -DCMAKE_CXX_COMPILER=g++
          cmake --build build/coverage --target dafree_core_tests
          ctest --test-dir build/coverage --output-on-failure
      - name: Enforce model and scanner line coverage
        run: |
          cmake -E make_directory build/coverage-html
          gcovr --root . \
            --filter 'core/(src/(model|scan)/|include/dafree/(model|scan|scan_types|backend)\.hpp$)' \
            --html-details build/coverage-html/index.html --xml build/coverage.xml \
            --json-summary build/coverage-summary.json --json build/coverage-data.json \
            --print-summary --fail-under-line 85 build/coverage
          gcovr --root . --add-tracefile build/coverage-data.json \
            --filter 'core/(src/model/|include/dafree/model\.hpp$)' --print-summary --fail-under-line 85
          gcovr --root . --add-tracefile build/coverage-data.json \
            --filter 'core/(src/scan/|include/dafree/(scan|scan_types|backend)\.hpp$)' \
            --print-summary --fail-under-line 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-coverage
          path: |
            build/coverage-html
            build/coverage.xml
            build/coverage-summary.json
            build/coverage-data.json
          retention-days: 14

  tsan:
    name: Scan engine ThreadSanitizer
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install cmake ninja Babel
      - name: Configure and build ThreadSanitizer tests
        run: |
          cmake --preset dev-tsan -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/dev-tsan --target dafree_core_tests
      - name: Exercise scanner concurrency under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ./build/dev-tsan/core/dafree_core_tests --no-colors \
            --test-case="scan_mock_matches_expected,cancel_marks_partial_and_returns_tree,pause_stops_new_reads,read_dir_error_marks_access_denied,overlapping_targets_rejected,multiple_targets_share_root,issue_queue_overflow_counted,partial_snapshots_remain_immutable,bounded_result_queue_applies_backpressure,engine_*,owner_resolution_*,counting_allocator_*,builder_small_batches_*"

  fuzz:
    name: Glob fuzz build and smoke
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install cmake ninja Babel
      - name: Configure Clang fuzz target
        run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++
      - name: Build and exercise glob fuzzer
        run: |
          cmake --build build/fuzz --target fuzz_glob
          corpus=$(mktemp -d)
          ./build/fuzz/core/fuzz_glob "$corpus" -runs=1000 -max_len=4096 -artifact_prefix="$corpus/"

  audit:
    name: Security and dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict -r requirements/dev.txt -r requirements/freeze.txt
      - name: Runtime license allowlist
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install ".[gui]" pip-licenses
          "$RUNNER_TEMP/runtime/bin/pip-licenses" \
            --allow-only="MIT;MIT License;BSD License;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache Software License;ISC;Python Software Foundation License;PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);MPL-2.0;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0" \
            --ignore-packages PySide6-Essentials shiboken6
      - name: C++ dependency licenses
        run: python tools/cpp_licenses.py cmake/Dependencies.cmake

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/docs.txt
      - name: Install documentation dependencies and package
        run: |
          python -m pip install --require-hashes -r requirements/docs.txt
          python -m pip install .
      - name: Build documentation (strict)
        run: mkdocs build --strict -f docs/mkdocs.yml
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress 'docs/**/*.md' README.md CONTRIBUTING.md
          fail: true

  ci-success:
    name: ci-success
    if: always()
    needs: [lint, cpp, python, asan, coverage, tsan, fuzz, audit, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$bad" ]; then
            echo "::error::Failed jobs: $bad"
            exit 1
          fi
